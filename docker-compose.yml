# Development compose: Arch + mise image with bind mounts for Fred / George
# and shared caches under .cache/.
#
# Cache *relative* paths: config/cache-layout.env (single source of truth).
# Always run via: bin/compose …   (injects that file for ${CACHE_*} interpolation)
# Host scripts: source bin/cache-env
#
# Prefer host-warmed caches: bin/setup && bin/compose up fred george

# Container paths = /workspace + relative layout (defaults match cache-layout.env).
x-cache-env: &cache-env
  BUNDLE_PATH: /workspace/${CACHE_BUNDLE:-.cache/bundle}
  BUNDLE_CACHE_PATH: /workspace/${CACHE_RUBYGEMS:-.cache/rubygems}
  YARN_CACHE_FOLDER: /workspace/${CACHE_YARN_FOLDER:-.cache/yarn-cache}

x-runtime-env: &runtime-env
  HOME: /home/dev
  MISE_DATA_DIR: /home/dev/.local/share/mise

# Merged env for every service; apps only add PORT.
x-service-env: &service-env
  <<: [*cache-env, *runtime-env]

x-healthcheck: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  base: &base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    image: docker-bundler-yarn-cache-dev:latest
    user: dev
    working_dir: /workspace
    environment:
      <<: *service-env
    volumes:
      # Whole monorepo (includes .cache, apps, config, node_modules).
      - .:/workspace:cached
    stdin_open: true
    tty: true

  dev:
    <<: *base
    profiles: ["dev"]
    command: ["bash", "-lc", "mise install && exec bash"]

  fred:
    <<: *base
    working_dir: /workspace/fred
    environment:
      <<: *service-env
      PORT: "3000"
    command: ["bash", "-lc", "exec /workspace/bin/docker-app"]
    ports:
      - "3000:3000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]

  george:
    <<: *base
    working_dir: /workspace/george
    environment:
      <<: *service-env
      PORT: "3001"
    command: ["bash", "-lc", "exec /workspace/bin/docker-app"]
    ports:
      - "3001:3001"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3001/up"]
