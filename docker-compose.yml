# Development compose: Arch + mise image with bind mounts for shared gem/yarn
# download caches and the Fred / George Rails apps.
#
# Prefer host-warmed caches: run `bin/setup` on the host first, then
# `docker compose up`. App containers use bin/docker-app which installs from
# .cache/rubygems and .cache/yarn before falling back to the network.

services:
  base: &base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    image: docker-bundler-yarn-cache-dev:latest
    user: dev
    working_dir: /workspace
    environment:
      # Install tree + download caches (absolute so app-relative configs cannot drift).
      BUNDLE_PATH: /workspace/.cache/bundle
      BUNDLE_CACHE_PATH: /workspace/.cache/rubygems
      BUNDLE_CACHE_ALL: "true"
      BUNDLE_CACHE_ALL_PLATFORMS: "true"
      BUNDLE_DISABLE_SHARED_GEMS: "true"
      YARN_CACHE_FOLDER: /workspace/.cache/yarn
      MISE_DATA_DIR: /home/dev/.local/share/mise
      HOME: /home/dev
    volumes:
      # Full monorepo (apps, root tooling, node_modules, caches)
      - .:/workspace:cached
      # Explicit binds for shared install + download caches
      - ./.cache/bundle:/workspace/.cache/bundle:cached
      - ./.cache/rubygems:/workspace/.cache/rubygems:cached
      - ./.cache/yarn:/workspace/.cache/yarn:cached
      - ./fred:/workspace/fred:cached
      - ./george:/workspace/george:cached
    stdin_open: true
    tty: true

  # Interactive shell for general development / cache inspection
  dev:
    <<: *base
    profiles: ["dev"]
    command: ["bash", "-lc", "mise install && exec bash"]

  # Fred Rails app (http://localhost:3000)
  fred:
    <<: *base
    working_dir: /workspace/fred
    environment:
      BUNDLE_PATH: /workspace/.cache/bundle
      BUNDLE_CACHE_PATH: /workspace/.cache/rubygems
      BUNDLE_CACHE_ALL: "true"
      BUNDLE_CACHE_ALL_PLATFORMS: "true"
      BUNDLE_DISABLE_SHARED_GEMS: "true"
      YARN_CACHE_FOLDER: /workspace/.cache/yarn
      MISE_DATA_DIR: /home/dev/.local/share/mise
      HOME: /home/dev
      PORT: "3000"
    command: ["bash", "-lc", "exec /workspace/bin/docker-app"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # George Rails app (http://localhost:3001)
  george:
    <<: *base
    working_dir: /workspace/george
    environment:
      BUNDLE_PATH: /workspace/.cache/bundle
      BUNDLE_CACHE_PATH: /workspace/.cache/rubygems
      BUNDLE_CACHE_ALL: "true"
      BUNDLE_CACHE_ALL_PLATFORMS: "true"
      BUNDLE_DISABLE_SHARED_GEMS: "true"
      YARN_CACHE_FOLDER: /workspace/.cache/yarn
      MISE_DATA_DIR: /home/dev/.local/share/mise
      HOME: /home/dev
      PORT: "3001"
    command: ["bash", "-lc", "exec /workspace/bin/docker-app"]
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
